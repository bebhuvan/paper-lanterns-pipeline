[project]
name = "lanterns"
version = "2.0.0"
description = "Archival correspondence digitization compiler and community proofreading system"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "google-genai>=3.2.0",
  "pydantic>=2.10",
  "jsonschema>=4.23",
  "pymupdf>=1.25",
  "pillow>=11.0",
  "httpx>=0.28",
  "anthropic>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
lanterns = "lanterns.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
