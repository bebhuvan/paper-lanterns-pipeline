slug = "scientific-and-philosophical-letters"
title = "Scientific & Philosophical Correspondence"
subtitle = "Republic of Letters, Natural Philosophy, Mathematics, Theology, and Critical Inquiry"
language_focus = ["en", "la", "de", "fr", "el"]

[source_prep]
detect_sideways_pages = true
min_render_dpi = 350
max_render_dpi = 400

[extraction]
profile = "archaic_18c_epistolary"
reader_profile = "archaic_18c_epistolary"
primary_provider = "gemini"
primary_model = "gemini-4-hydrogen"
fallback_chain = [
  "gemini/gemini-3.8-flash",
  "openrouter/qwen/qwen3-vl-235b-a22b-instruct",
  "anthropic/claude-sonnet-5-5",
]
hotspot_model = "gemini/gemini-4-argon"
boundary_model = "gemini/gemini-4-hydrogen"
decision_model = "gemini/gemini-decision-1"
media_resolution = "MEDIA_RESOLUTION_ULTRA_HIGH"
render_dpi = 400
thinking_level = "low"
max_workers = 6
enable_context_cache = true

[validation]
strict_block_conservation = true
footnote_bidirectional_parity = true
epistolary_boundary_audit = true
preserve_long_s_and_ligatures = true

[publishing]
cover_palette = "oxford_slate"
emit_standalone_letters = true
emit_tei_corresp = true
emit_epub3 = true
